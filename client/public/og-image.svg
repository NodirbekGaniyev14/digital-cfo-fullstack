      <stop offset="0" stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1010" cy="120" r="260" fill="#10B981" opacity="0.10" />
  <circle cx="170" cy="560" r="220" fill="#3B82F6" opacity="0.10" />

  <!-- Logo -->
  <g transform="translate(90,86)">
    <rect width="64" height="64" rx="16" fill="#0B1220" stroke="#10B981" stroke-width="2" />
    <g transform="translate(16,17)" stroke="#10B981" stroke-width="3.5" fill="none" stroke-linecap="round">
      <line x1="2" y1="28" x2="2" y2="18" />
      <line x1="14" y1="28" x2="14" y2="10" />
      <line x1="26" y1="28" x2="26" y2="2" />
    </g>
    <text x="84" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">
