  </text>

  <!-- KPI pill'lar -->
  <g font-family="Arial, sans-serif">
    <rect x="90" y="496" width="190" height="64" rx="14" fill="#FFFFFF" opacity="0.06" />
    <text x="110" y="524" font-size="18" fill="#94A3B8">Likvidlik</text>
    <text x="110" y="550" font-size="26" font-weight="700" fill="#3B82F6">2.41</text>

    <rect x="298" y="496" width="190" height="64" rx="14" fill="#FFFFFF" opacity="0.06" />
    <text x="318" y="524" font-size="18" fill="#94A3B8">Sof foyda</text>
    <text x="318" y="550" font-size="26" font-weight="700" fill="#10B981">18.5%</text>

    <rect x="506" y="496" width="190" height="64" rx="14" fill="#FFFFFF" opacity="0.06" />
    <text x="526" y="524" font-size="18" fill="#94A3B8">Risk Score</text>
    <text x="526" y="550" font-size="26" font-weight="700" fill="#FFFFFF">23</text>
