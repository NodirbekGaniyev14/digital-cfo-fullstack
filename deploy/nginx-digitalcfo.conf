# nginx reverse-proxy — 80/443 portni Node serverga (127.0.0.1:4000) yo'naltiradi.
# Joylashuv: /etc/nginx/sites-available/digitalcfo  (setup.sh buni avtomatik qiladi)

server {
    listen 80;
    listen [::]:80;
    server_name digitalcfo.uz www.digitalcfo.uz;

    # 2 ta 15 MB fayl yuklanishi mumkin — nginx default 1 MB ni oshiramiz.
    client_max_body_size 35m;

    # nginx'ning default gzip_types faqat text/html. Node tomonda ham
    # compression middleware bor, lekin proxy javobini ham siqa olishi uchun
    # turlarni ochamiz (ikki marta siqilmaydi — Content-Encoding bo'lsa o'tkazadi).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/woff font/woff2;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Eslatma: `sudo certbot --nginx -d digitalcfo.uz -d www.digitalcfo.uz` ishlatilganda
# certbot avtomatik 443 (HTTPS) blokini va 80 -> 443 yo'naltirishni qo'shadi.
