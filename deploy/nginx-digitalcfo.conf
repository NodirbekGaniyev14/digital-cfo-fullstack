# nginx reverse-proxy — 80/443 portni Node serverga (127.0.0.1:4000) yo'naltiradi.
# Joylashuv: /etc/nginx/sites-available/digitalcfo  (setup.sh buni avtomatik qiladi)

server {
    listen 80;
    listen [::]:80;
    server_name digitalcfo.uz www.digitalcfo.uz;

    # 2 ta 15 MB fayl yuklanishi mumkin — nginx default 1 MB ni oshiramiz.
    client_max_body_size 35m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Eslatma: `sudo certbot --nginx -d digitalcfo.uz -d www.digitalcfo.uz` ishlatilganda
# certbot avtomatik 443 (HTTPS) blokini va 80 -> 443 yo'naltirishni qo'shadi.
